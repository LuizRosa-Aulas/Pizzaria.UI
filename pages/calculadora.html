<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
      <div class="container py-4">
		<div class="row g-4">
			<div class="col-md-3">
                Calculadora
            </div>
        </div>
    </div>

    <form class="row g-3 needs-validation" novalidate>
  <div class="col-md-4">
    <label for="numero1" class="form-label"> Número 1 </label>
    <input type="text" class="form-control" id="numero1" value="" required>
    <div class="valid-feedback">
    </div>
  </div>
  <div class="col-md-4">
    <label for="numero2" class="form-label"> Número 2 </label>
    <input type="text" class="form-control" id="numero2" value="" required>
    <div class="valid-feedback">
    </div>
  </div>
  <div class="col-md-3">
    <label for="operacao" class="form-label">Operação</label>
    <select class="form-select" id="operacao" required>
      <option value = "+"> + </option>
      <option value = "-"> - </option>
      <option value = "x"> x </option>
      <option value = "/"> / </option>
    </select>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit" id = "calcular">Calcular</button>
  </div>
</form>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--JS-->
    <script src="../js/Calculadora.js"></script>
</body>
</html>
