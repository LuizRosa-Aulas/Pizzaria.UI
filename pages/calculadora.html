<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form class="row g-3 needs-validation" novalidate>
        <div class="col-md-4">
            <label for="numero1" class="form-label">Numero 1</label>
            <input type="text" class="form-control" id="numero1" required>
            <div class="valid-feedback">
                Looks good!
            </div>
        </div>
        <div class="col-md-4">
            <label for="numero2" class="form-label">Numero 2</label>
            <input type="text" class="form-control" id="numero2" required>
            <div class="valid-feedback">
                Looks good!
            </div>
        </div>        
        <div class="col-md-3">
            <label for="operacao" class="form-label">Operação</label>
            <select class="form-select" id="operacao" required>
            <option value="+" selected>+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            </select>
            <div class="invalid-feedback">
                Selecione uma operação válida.
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" id="Calcular">Calcular</button>
        </div>
        </form>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS -->
    <script src="../js/Calculadora.js"></script>
</body>
</html>
